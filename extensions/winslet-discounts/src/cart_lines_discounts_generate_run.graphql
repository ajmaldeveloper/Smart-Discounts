query CartLinesDiscountsGenerateRunInput {
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    # Set once per cart by public/widgets/ab-test-bootstrap.js (either
    # "A" or "B") — decides which variant of an A/B-tested campaign, if
    # either, is eligible to apply for this shopper. Missing/blank
    # (script never ran, JS disabled, ad blocker) defaults to "A" — see
    # abBucketFor() below — so an experiment degrades to control-only
    # rather than silently withholding any discount.
    abBucketAttribute: attribute(key: "_winslet_ab_bucket") {
      value
    }
    buyerIdentity {
      isAuthenticated
      customer {
        id
        numberOfOrders
        amountSpent {
          amount
        }
        buyerDataMetafield: metafield(namespace: "$app", key: "buyer_data") {
          value
        }
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          sku
          weight
          product {
            id
            vendor
            productType
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      value
    }
    usageCountMetafield: metafield(namespace: "$app", key: "usage-count") {
      value
    }
  }
  localization {
    country {
      isoCode
    }
    language {
      isoCode
    }
  }
}
