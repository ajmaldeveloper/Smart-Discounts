app = "winslet-smart-discounts"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Gates fly-proxy from routing real traffic (including Shopify
  # webhook deliveries) to a machine until it's actually confirmed
  # listening — closes the brief window during a rolling deploy where
  # a machine has "started" but the app hasn't bound to the port yet.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
